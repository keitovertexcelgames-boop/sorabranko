<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140c12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>空中ブランコ</title>
  <style>
    :root {
      --night: #140c12;
      --gold: #e6b35c;
      --cream: #f3e6d0;
      --burgundy: #7c2436;
      --miss: #e07a7a;
      --sky: #8ec8e0;
      --safe-x: max(env(safe-area-inset-left), env(safe-area-inset-right));
      --safe-y: max(env(safe-area-inset-top), env(safe-area-inset-bottom));
      --display: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif CJK JP", "WenQuanYi Micro Hei", serif;
      --body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans CJK JP", "WenQuanYi Micro Hei", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--night);
      color: var(--cream);
      font-family: var(--body);
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    [hidden] { display: none !important; }
    #app {
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    button {
      font-family: var(--display);
      color: var(--cream);
      background: var(--burgundy);
      border: 1.5px solid var(--gold);
      border-radius: 999px;
      padding: 10px 28px;
      font-size: 20px;
      line-height: 1.2;
      touch-action: manipulation;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      border-color: transparent;
      font-family: var(--body);
      font-size: 13px;
      padding: 6px 10px;
    }
    #mute {
      position: absolute;
      z-index: 7;
      top: calc(8px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      font-family: var(--body);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.45);
    }
    #title, #result, #rotate {
      position: absolute;
      inset: 0;
    }
    #title {
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      pointer-events: none;
      padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }
    #title h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(28px, 6vh, 42px);
      color: var(--gold);
    }
    #title p { margin: 4px 0 0; font-size: clamp(12px, 2.1vh, 14px); }
    #title .rules {
      margin: 10px 0;
      font-size: clamp(11px, 1.9vh, 13px);
      line-height: 1.45;
    }
    #title button, #result button { pointer-events: auto; }
    #result {
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px;
    }
    #result .card {
      width: min(640px, 100%);
      max-height: 100%;
      overflow: auto;
      touch-action: pan-y;
      background: rgba(20, 12, 18, 0.88);
      border: 1px solid rgba(230, 179, 92, 0.75);
      border-radius: 18px;
      padding: 14px 16px 12px;
      text-align: center;
    }
    #result h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(22px, 5vh, 28px);
      color: var(--gold);
    }
    #result .sub { margin: 4px 0 8px; font-size: 13px; }
    #result .split {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      text-align: left;
    }
    #total {
      font-family: var(--display);
      font-size: clamp(28px, 6vh, 36px);
      line-height: 1;
    }
    #best { color: var(--gold); font-size: 12px; margin-top: 4px; }
    .label { font-size: 12px; opacity: 0.8; }
    #rows { min-width: min(280px, 46vw); }
    .row {
      display: flex;
      gap: 8px;
      font-size: 12px;
      margin: 3px 0;
    }
    .row span:first-child { flex: 1; }
    .gold { color: var(--gold); }
    .points { width: 4.5em; text-align: right; }
    .note { font-size: 10px; opacity: 0.65; margin-top: 4px; }
    #chips { display: flex; gap: 8px; margin-top: 6px; }
    .chip { min-width: 36px; text-align: center; font-size: 9px; }
    .chip strong { display: block; font-size: 14px; }
    .chip.sky { color: var(--sky); }
    .chip.miss { color: var(--miss); }
    .actions { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    #rotate {
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--night);
      color: var(--gold);
      font-family: var(--display);
      font-size: 28px;
    }
    #rotate p { margin: 8px 0 0; color: var(--cream); font-family: var(--body); font-size: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="view" width="844" height="390"></canvas>
    <div id="title">
      <h1>空中ブランコ</h1>
      <p>星と拍が重なる「ノ」で、手を離せ</p>
      <div class="rules">
        さん、はい、セー、ノ。バーが星を通る瞬間が完璧。<br>
        早いと飛びすぎ、遅いと届かない。キャッチャーの手元が的。<br>
        音は最初のタップで鳴り始めます。
      </div>
      <button id="start" type="button">幕を開ける</button>
    </div>
    <div id="result" hidden>
      <div class="card">
        <h2 id="headline">もう一稽古</h2>
        <p class="sub" id="subtitle"></p>
        <div class="split">
          <div>
            <div class="label">総得点</div>
            <div id="total">0</div>
            <div id="best"></div>
            <div class="actions">
              <button id="retry" type="button">もう一度</button>
              <button id="back" class="ghost" type="button">タイトルへ</button>
            </div>
          </div>
          <div>
            <div id="rows"></div>
            <div class="note">幕ボーナスはキャッチの数だけ</div>
            <div id="chips"></div>
          </div>
        </div>
      </div>
    </div>
    <button id="mute" type="button" aria-label="音をオフにする">音オン</button>
    <div id="rotate" hidden>
      横にしてください
      <p>空中ブランコは横画面で飛びます。</p>
    </div>
  </div>
  <script src="tuning.js"></script>
  <script src="physics.js"></script>
  <script src="audio.js"></script>
  <script src="draw.js"></script>
  <script src="game.js"></script>
</body>
</html>
