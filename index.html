<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd4f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>空中ブランコ</title>
  <style>
    :root {
      --sky: #8fd4f5;
      --ink: #24324a;
      --cream: #fff8ee;
      --coral: #ff4d6d;
      --orange: #d35400;
      --gold: #e09f3e;
      --display: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Yu Gothic", "YuGothic", "Noto Sans CJK JP", "WenQuanYi Micro Hei", sans-serif;
      --body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans CJK JP", "WenQuanYi Micro Hei", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--sky);
      color: var(--ink);
      font-family: var(--body);
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    [hidden] { display: none !important; }
    #app {
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    button {
      font-family: var(--display);
      color: #fff;
      background: var(--coral);
      border: 0;
      border-radius: 999px;
      padding: 10px 28px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: 0 3px 0 #c93654;
    }
    button.ghost {
      background: transparent;
      border: 0;
      box-shadow: none;
      color: var(--ink);
      font-family: var(--body);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
    }
    #mute {
      position: absolute;
      z-index: 7;
      top: calc(8px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      font-family: var(--body);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      color: var(--ink);
      background: rgba(255, 248, 238, 0.88);
      box-shadow: none;
    }
    #title, #result, #rotate {
      position: absolute;
      inset: 0;
    }
    #title {
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      pointer-events: none;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }
    #title .card, #result .card {
      pointer-events: none;
      background: rgba(255, 248, 238, 0.92);
      border-radius: 18px;
      padding: 10px 16px 12px;
      box-shadow: 0 8px 24px rgba(36, 50, 74, 0.12);
    }
    #title h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(26px, 5.4vh, 36px);
      color: var(--coral);
    }
    #title p { margin: 2px 0 0; font-size: clamp(12px, 2.1vh, 14px); }
    #title .rules {
      margin: 6px 0 8px;
      font-size: clamp(11px, 1.9vh, 13px);
      line-height: 1.45;
    }
    #title button, #result button { pointer-events: auto; }
    #result {
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(143, 212, 245, 0.35);
      padding: 12px;
    }
    #result .card {
      width: min(680px, 100%);
      max-height: 100%;
      overflow: auto;
      touch-action: pan-y;
      pointer-events: auto;
      text-align: center;
    }
    #result h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(22px, 5vh, 28px);
      color: var(--coral);
    }
    #result .sub { margin: 4px 0 8px; font-size: 13px; }
    #result .split {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      text-align: left;
    }
    #total {
      font-family: var(--display);
      font-size: clamp(28px, 6vh, 36px);
      line-height: 1;
      color: var(--orange);
    }
    #best { color: var(--orange); font-size: 12px; margin-top: 4px; }
    .label { font-size: 12px; opacity: 0.75; }
    #rows { min-width: min(300px, 48vw); }
    .row {
      display: flex;
      gap: 8px;
      font-size: 12px;
      margin: 3px 0;
    }
    .row span:first-child { flex: 1; }
    .gold { color: var(--orange); font-weight: 700; }
    .points { width: 4.5em; text-align: right; }
    .note { font-size: 10px; opacity: 0.7; margin-top: 4px; }
    #chips { display: flex; gap: 8px; margin-top: 6px; }
    .chip { min-width: 36px; text-align: center; font-size: 9px; }
    .chip strong { display: block; font-size: 14px; color: var(--coral); }
    .actions { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    #rotate {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--sky);
      color: var(--coral);
      font-family: var(--display);
      font-size: 28px;
      font-weight: 700;
    }
    #rotate p { margin: 8px 0 0; color: var(--ink); font-family: var(--body); font-size: 14px; font-weight: 500; }
    @media (max-height: 360px) {
      #title .rules { display: none; }
      #title .card { padding: 6px 14px 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="view" width="844" height="390"></canvas>
    <div id="title">
      <div class="card">
        <h1>空中ブランコ</h1>
        <p>席が的の真上を通る「ノ」で、手を離せ</p>
        <div class="rules">
          回るほど鎖が開いて、席は外へ持ち上がる。<br>
          さん、はい、セー、ノ。早いとクッション、遅いとプール。<br>
          音は最初のタップで鳴り始めます。
        </div>
        <button id="start" type="button">乗車する</button>
      </div>
    </div>
    <div id="result" hidden>
      <div class="card">
        <h2 id="headline">もう一周</h2>
        <p class="sub" id="subtitle"></p>
        <div class="split">
          <div>
            <div class="label">総得点</div>
            <div id="total">0</div>
            <div id="best"></div>
            <div class="actions">
              <button id="retry" type="button">もう一周</button>
              <button id="back" class="ghost" type="button">チケット売り場へ</button>
            </div>
          </div>
          <div>
            <div id="rows"></div>
            <div class="note">区ボーナスは、的に入った回数だけ</div>
            <div id="chips"></div>
          </div>
        </div>
      </div>
    </div>
    <button id="mute" type="button" aria-label="音をオフにする">音オン</button>
    <div id="rotate" hidden>
      横にしてください
      <p>空中ブランコは横画面で回ります。</p>
    </div>
  </div>
  <script src="tuning.js"></script>
  <script src="physics.js"></script>
  <script src="audio.js"></script>
  <script src="draw.js"></script>
  <script src="game.js"></script>
</body>
</html>
